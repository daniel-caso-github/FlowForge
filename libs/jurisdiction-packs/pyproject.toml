[project]
name = "jurisdiction-packs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flowforge-contracts",
    "pydantic>=2.7",
    "defusedxml>=0.7",
]

[tool.uv.sources]
flowforge-contracts = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jurisdiction_packs"]
