[project]
name = "flowforge"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "libs/contracts",
    "services/budget",
    "services/external-sim",
    "worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
