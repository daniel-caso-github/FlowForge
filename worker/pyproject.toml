[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flowforge-contracts",
    "temporalio>=1.7",
    "httpx>=0.27",
]

[tool.uv.sources]
flowforge-contracts = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
