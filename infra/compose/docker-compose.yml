services:
  postgres-temporal:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      - postgres-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres-temporal
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  postgres-budget:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "5434:5432"

  budget-service:
    build:
      context: ../..
      dockerfile: infra/compose/budget.Dockerfile
    depends_on:
      - postgres-budget
    environment:
      BUDGET_DATABASE_URL: postgresql+psycopg://budget:budget@postgres-budget:5432/budget
    ports:
      - "8001:8001"

  external-sim:
    build:
      context: ../..
      dockerfile: infra/compose/external-sim.Dockerfile
    ports:
      - "8002:8002"

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/worker.Dockerfile
    depends_on:
      - temporal
      - budget-service
      - external-sim
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      BUDGET_SERVICE_URL: http://budget-service:8001
      EXTERNAL_SIM_URL: http://external-sim:8002

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
