[project]
name = "datagen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flowforge-contracts",
    "jurisdiction-packs",
]

[tool.uv.sources]
flowforge-contracts = { workspace = true }
jurisdiction-packs = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
datagen = "datagen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]
